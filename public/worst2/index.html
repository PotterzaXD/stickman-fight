<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worst Stickman Fighter v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--surface-0); font-family: var(--font-sans); color: var(--text-primary); padding: 1rem; }

  .menu { display: block; }
  .menu.hidden { display: none; }
  .gameplay { display: none; }
  .gameplay.active { display: block; }

  .panel {
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row label { min-width: 80px; font-size: 13px; }
  .row select { flex: 1; padding: 6px 8px; }

  button {
    padding: 8px 12px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: var(--surface-1); }

  .canvas-wrap { position: relative; max-width: 800px; margin-bottom: 1rem; }

  #canvas {
    width: 100%;
    border: 2px solid var(--border-strong);
    border-radius: 8px;
    display: block;
  }

  #joy {
    position: absolute;
    left: 16px;
    bottom: 16px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.15);
    border: 2px solid rgba(0, 0, 0, 0.35);
    touch-action: none;
    user-select: none;
  }

  #knob {
    position: absolute;
    left: calc(50% - 22px);
    top: calc(50% - 22px);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    border: 2px solid #111;
    pointer-events: none;
  }

  .stats { display: flex; gap: 1rem; margin-bottom: 1rem; }
  .stat { background: var(--surface-2); padding: 1rem; border-radius: 6px; flex: 1; }
  .stat-label { font-size: 12px; color: var(--text-secondary); }
  .stat-value { font-size: 20px; font-weight: 500; }
</style>
<style>#sfExit{position:fixed;top:10px;right:10px;z-index:9999;font:600 14px system-ui,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid #141413;background:#fff;color:#141413;cursor:pointer;opacity:.9}</style>
</head>
<body>
<button id="sfExit" onclick="exitToStickmanFight()">← Stickman Fight</button>
<script>
// Back to Stickman Fight (this game keeps its own money, separate from Stickman Fight's coins).
function exitToStickmanFight() {
  if (window.parent !== window) window.parent.postMessage({ type: 'worst2-exit' }, location.origin);
  else location.href = '/';
}
</script>

<div class="menu" id="menu">
  <h1>WORST Stickman Fighter™ v2</h1>
  <p style="color: var(--text-secondary); margin-bottom: 1rem;">Chaos. Pure chaos.</p>

  <div class="panel">
    <div class="row">
      <label>Bots:</label>
      <select id="botCount">
        <option>1</option>
        <option>2</option>
        <option>3</option>
      </select>
    </div>

    <div class="row">
      <label>Bot type:</label>
      <select id="botType">
        <option value="normal">Normal stickmen</option>
        <option value="retro" id="retroOption" disabled>Retro Stickguy (locked, 4,000 coins)</option>
        <option value="mixed">Mixed</option>
      </select>
    </div>

    <div class="row">
      <label>Weapon:</label>
      <select id="weaponSelect">
        <option value="fists">Fists (5 dmg)</option>
        <option value="knife">Knife (12 dmg)</option>
        <option value="bat">Bat (20 dmg)</option>
      </select>
    </div>

    <div class="row">
      <label>Map:</label>
      <select id="mapSelect">
        <option value="sky">Sky Arena</option>
        <option value="lava">Lava Pit</option>
        <option value="night">Night Rooftop</option>
      </select>
    </div>

    <p id="coinText" style="font-size: 13px; margin-bottom: 0.5rem;">Coins: 300</p>
    <div style="display: flex; gap: 8px; margin-bottom: 0.5rem;">
      <button id="shopBtn" onclick="buyRetro()" style="flex: 1;">Buy Retro Stickguy (4,000 coins)</button>
    </div>
    <div style="display: flex; gap: 8px; margin-bottom: 1rem;">
      <button onclick="startBossFight()" style="flex: 1;">BOSS: The Magical Elephant (25,000 HP)</button>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 1rem;">
      <button onclick="startGame()" style="flex: 1;">PLAY</button>
      <button onclick="watchBotsOnly()" style="flex: 1;">WATCH BOTS FIGHT</button>
    </div>

    <p id="recordText" style="margin-bottom: 0.75rem; font-size: 13px;">Record: 0 wins, 0 losses</p>

    <p style="margin-top: 1rem; font-size: 12px;">
      <a href="https://friendly-melba-0bfd78.netlify.app/" target="_blank" style="color: var(--text-accent); text-decoration: none;">
        this is watching comedy what about actual fighting?
      </a>
    </p>
    <p style="font-size: 11px; color: var(--text-secondary); margin-top: 0.5rem;">Click the text above me!</p>
  </div>
</div>

<div class="gameplay" id="gameplay">
  <div class="canvas-wrap">
    <canvas id="canvas" width="800" height="400"></canvas>
    <div id="joy"><div id="knob"></div></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Your Health</div>
      <div class="stat-value" id="healthDisplay">100%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Enemies Left</div>
      <div class="stat-value" id="enemiesDisplay">0</div>
    </div>
  </div>

  <button id="killFeedBtn" onclick="toggleKillFeed()">Kill feed: On</button>
  <button onclick="backToMenu()">BACK TO MENU</button>
  <div id="gameOverMsg" style="display:none; font-size:24px; font-weight:bold; margin-top:1rem;"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Retro Stickguy pixel sprite: K = black pixel, S = knife blade
const RETRO_SPRITE = [
  "...KKK...",
  "..K...K..",
  "..K...K..",
  "...KKK...",
  "....K...S",
  "..KKKKKKS",
  "....K....",
  "....K....",
  "...K.K...",
  "..K...K..",
  "..K...K..",
  ".K.....K."
];
const PIXEL = 3;

let gameActive = false;
let player = null;
let enemies = [];
let keys = {};
let watchMode = false;
let stickCounter = 0;
let killFeedOn = true;
let record = { wins: 0, losses: 0 };

function updateRecord() {
  document.getElementById('recordText').textContent = `Record: ${record.wins} wins, ${record.losses} losses`;
}
let killFeed = [];

class Stick {
  constructor(x, y, isPlayer, type = 'normal') {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.type = type;
    this.maxHealth = type === 'retro' ? 400 : 100;
    this.health = this.maxHealth;
    this.isPlayer = isPlayer;
    this.onGround = false;
    this.cooldown = 0;
    this.id = ++stickCounter;
    this.lastHitBy = null;
  }

  update(w, h) {
    this.vy += 0.6;
    this.x += this.vx;
    this.y += this.vy;

    if (this.onGround) this.vx *= 0.8;

    if (this.y > h - 20) {
      this.y = h - 20;
      this.vy *= -0.25;
      this.onGround = true;
    } else {
      this.onGround = false;
    }

    if (this.x < 10) this.x = 10;
    if (this.x > w - 10) this.x = w - 10;
  }

  draw() {
    if (this.type === 'retro') {
      drawRetro(this.x, this.y);
    } else {
      drawStick(this.x, this.y, this.isPlayer ? '#FFD700' : '#f66');
    }

    // Held weapon for the player
    if (this.isPlayer && currentWeapon && currentWeapon.color) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.strokeStyle = currentWeapon.color;
      ctx.lineWidth = currentWeapon.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(currentWeapon.tip[0], currentWeapon.tip[1]);
      ctx.stroke();
      ctx.restore();
    }

    // Health bar
    const barWidth = (this.health / this.maxHealth) * 16;
    ctx.fillStyle = '#f00';
    ctx.fillRect(this.x - 8, this.y - 28, Math.max(0, barWidth), 2);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.strokeRect(this.x - 8, this.y - 28, 16, 2);
  }
}

// Draws a stickman with a thin dark outline around its lines
function drawStick(x, y, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round';

  // Dark outline pass
  strokeSkeleton('#111', 4.5);
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(0, -15, 7.5, 0, Math.PI * 2);
  ctx.fill();

  // Colored pass
  strokeSkeleton(color, 2.5);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, -15, 5.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function strokeSkeleton(color, lineWidth) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  ctx.moveTo(0, -9);
  ctx.lineTo(0, 10);
  ctx.moveTo(0, -3);
  ctx.lineTo(-8, 0);
  ctx.moveTo(0, -3);
  ctx.lineTo(8, 0);
  ctx.moveTo(0, 10);
  ctx.lineTo(-5, 22);
  ctx.moveTo(0, 10);
  ctx.lineTo(5, 22);
  ctx.stroke();
}

// Draws the Retro Stickguy as blocky black pixels with a knife
function drawRetro(x, y) {
  const ox = x - 4 * PIXEL;
  const oy = y - 12;
  RETRO_SPRITE.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) {
      const cell = row[c];
      if (cell === '.') continue;
      ctx.fillStyle = cell === 'S' ? '#bbb' : '#111';
      ctx.fillRect(ox + c * PIXEL, oy + r * PIXEL, PIXEL, PIXEL);
    }
  });
}

function attack(attacker, target, damage, knockback) {
  target.health -= damage;
  target.lastHitBy = attacker;
  target.vx += target.x > attacker.x ? knockback : -knockback;
  target.vy -= 2;
}

document.addEventListener('keydown', (e) => keys[e.key] = true);
document.addEventListener('keyup', (e) => keys[e.key] = false);

// On-screen joystick (touch or mouse). dx/dy range from -1 to 1.
const joy = document.getElementById('joy');
const knob = document.getElementById('knob');
const stick = { dx: 0, dy: 0 };
const JOY_RADIUS = 55;

function moveStick(clientX, clientY) {
  const r = joy.getBoundingClientRect();
  let dx = clientX - (r.left + r.width / 2);
  let dy = clientY - (r.top + r.height / 2);
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_RADIUS) {
    dx = (dx / dist) * JOY_RADIUS;
    dy = (dy / dist) * JOY_RADIUS;
  }
  stick.dx = dx / JOY_RADIUS;
  stick.dy = dy / JOY_RADIUS;
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
}

function resetStick() {
  stick.dx = 0;
  stick.dy = 0;
  knob.style.transform = 'translate(0px, 0px)';
}

joy.addEventListener('pointerdown', (e) => {
  joy.setPointerCapture(e.pointerId);
  moveStick(e.clientX, e.clientY);
});
joy.addEventListener('pointermove', (e) => {
  if (joy.hasPointerCapture(e.pointerId)) moveStick(e.clientX, e.clientY);
});
joy.addEventListener('pointerup', resetStick);
joy.addEventListener('pointercancel', resetStick);

function pickBotType(i) {
  const choice = document.getElementById('botType').value;
  if (choice === 'retro') return 'retro';
  if (choice === 'mixed') return i % 2 === 0 ? 'retro' : 'normal';
  return 'normal';
}

function startGame() {
  const botCount = parseInt(document.getElementById('botCount').value);

  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameplay').classList.add('active');

  player = new Stick(100, 300, true);
  enemies = [];
  for (let i = 0; i < botCount; i++) {
    enemies.push(new Stick(300 + i * 150, 300, false, pickBotType(i)));
  }

  watchMode = false;
  bossMode = false;
  boss = null;
  gameActive = true;
  joy.style.display = 'block';
  resetStick();
  document.getElementById('gameOverMsg').style.display = 'none';
  gameLoop();
}

function watchBotsOnly() {
  const botCount = parseInt(document.getElementById('botCount').value);

  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameplay').classList.add('active');

  player = null;
  enemies = [];
  for (let i = 0; i < botCount; i++) {
    enemies.push(new Stick(200 + i * 150, 300, false, pickBotType(i)));
  }

  watchMode = true;
  gameActive = true;
  joy.style.display = 'none';
  document.getElementById('gameOverMsg').style.display = 'none';
  gameLoop();
}

const WEAPONS = {
  fists: { damage: 5, reach: 55, knockback: 10, color: null },
  knife: { damage: 12, reach: 65, knockback: 8, color: '#ccc', width: 2, tip: [14, -8] },
  bat: { damage: 20, reach: 80, knockback: 14, color: '#8B5A2B', width: 4, tip: [16, -14] }
};
let currentWeapon = WEAPONS.fists;

const MAP_THEMES = {
  sky: { top: '#87CEEB', bottom: '#90EE90', ground: '#4a8f3a' },
  lava: { top: '#ff7a1a', bottom: '#4a0d00', ground: '#3a1a0a' },
  night: { top: '#0b1433', bottom: '#1d2b5a', ground: '#2a2f3a' }
};

function drawBackground() {
  const theme = MAP_THEMES[document.getElementById('mapSelect').value] || MAP_THEMES.sky;
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, theme.top);
  grad.addColorStop(1, theme.bottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = theme.ground;
  ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
}

// Text with a dark outline so it reads on every map
function drawLabel(text, x, y, align = 'left') {
  ctx.font = '14px Arial';
  ctx.textAlign = align;
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#000';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x, y);
  ctx.textAlign = 'left';
}

function fighterName(s) {
  if (!s) return 'Nobody';
  if (s.isPlayer) return 'You';
  if (s.type === 'retro') return 'Retro Stickguy';
  return `Bot ${s.id}`;
}

function addKill(killer, victim) {
  if (killer && killer.isPlayer) {
    coins += 25;
    updateShop();
  }
  killFeed.unshift({ text: `${fighterName(killer)} KO'd ${fighterName(victim)}`, time: performance.now() });
  killFeed = killFeed.slice(0, 5);
}

function drawKillFeed() {
  if (!killFeedOn) return;
  const now = performance.now();
  killFeed = killFeed.filter(k => now - k.time < 4000);
  killFeed.forEach((k, i) => drawLabel(k.text, canvas.width - 10, 25 + i * 18, 'right'));
}

function toggleKillFeed() {
  killFeedOn = !killFeedOn;
  if (!killFeedOn) killFeed = [];
  document.getElementById('killFeedBtn').textContent = `Kill feed: ${killFeedOn ? 'On' : 'Off'}`;
}

// Coins and shop
let coins = 300;
let retroOwned = false;

function updateShop() {
  document.getElementById('coinText').textContent = `Coins: ${coins.toLocaleString()}`;
  const btn = document.getElementById('shopBtn');
  btn.textContent = retroOwned ? 'Retro Stickguy owned' : 'Buy Retro Stickguy (4,000 coins)';
  btn.disabled = retroOwned;
  document.getElementById('retroOption').disabled = !retroOwned;
}

function buyRetro() {
  if (retroOwned) return;
  if (coins < 4000) {
    document.getElementById('shopBtn').textContent = `Need ${(4000 - coins).toLocaleString()} more coins`;
    setTimeout(updateShop, 1200);
    return;
  }
  coins -= 4000;
  retroOwned = true;
  updateShop();
}

// Boss fight: The Magical Elephant
let bossMode = false;
let boss = null;

function makeBoss() {
  return { x: 400, y: 150, baseY: 150, vx: 0, time: 0, state: 'hover', timer: 120, hitCd: 0, health: 25000, maxHealth: 25000 };
}

function startBossFight() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameplay').classList.add('active');

  player = new Stick(100, 300, true);
  enemies = [];
  boss = makeBoss();
  bossMode = true;
  watchMode = false;
  gameActive = true;
  joy.style.display = 'block';
  resetStick();
  document.getElementById('gameOverMsg').style.display = 'none';
  gameLoop();
}

function updateBoss() {
  const b = boss;
  b.time++;
  if (b.hitCd > 0) b.hitCd--;
  b.timer--;

  if (b.timer <= 0) {
    const moves = ['hover', 'dive', 'sweep'];
    b.state = moves[Math.floor(Math.random() * moves.length)];
    b.timer = b.state === 'dive' ? 110 : (b.state === 'sweep' ? 120 : 150);
    if (b.state === 'sweep') b.vx = (b.x < canvas.width / 2 ? 1 : -1) * 6;
  }

  if (b.state === 'hover') {
    b.x += Math.sin(b.time * 0.03) * 1.5;
    const targetY = b.baseY + Math.sin(b.time * 0.05) * 15;
    b.y += (targetY - b.y) * 0.08;
  } else if (b.state === 'sweep') {
    b.x += b.vx;
    if (b.x < 80 || b.x > canvas.width - 80) b.vx *= -1;
    b.x = Math.max(80, Math.min(canvas.width - 80, b.x));
    b.y += (b.baseY + 30 - b.y) * 0.1;
  } else if (b.state === 'dive') {
    if (b.timer > 50) {
      // Rise up before the swoop
      b.y = Math.max(40, b.y - 2);
    } else {
      // Swoop down toward the player
      b.x += (player.x - b.x) * 0.05;
      b.y += 7;
      if (b.y > 280) { b.y = 280; b.timer = 0; }
    }
  }

  // Contact damage to the player
  if (!watchMode && b.hitCd === 0 && Math.hypot(b.x - player.x, b.y - player.y) < 70) {
    const dmg = b.state === 'dive' ? 25 : (b.state === 'sweep' ? 15 : 8);
    player.health -= dmg;
    player.vx += player.x > b.x ? 10 : -10;
    player.vy = -6;
    b.hitCd = 45;
  }
}

function drawBoss() {
  const b = boss;
  const flap = Math.sin(b.time * 0.25) * 0.5;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;

  // Big ears act as wings
  ctx.fillStyle = '#c9a3b0';
  ctx.beginPath();
  ctx.ellipse(-40, -5, 40, 55, flap, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(40, -5, 40, 55, -flap, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Body
  ctx.fillStyle = '#9aa0a6';
  ctx.beginPath();
  ctx.ellipse(0, 0, 55, 38, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Head
  ctx.beginPath();
  ctx.arc(50, -20, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Trunk
  ctx.lineCap = 'round';
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#9aa0a6';
  ctx.beginPath();
  ctx.moveTo(70, -10);
  ctx.quadraticCurveTo(100, 10, 80, 50);
  ctx.stroke();

  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(58, -26, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Boss health bar
  const barX = 200;
  const barY = 62;
  const barW = 400;
  ctx.fillStyle = '#222';
  ctx.fillRect(barX, barY, barW, 14);
  ctx.fillStyle = '#e00';
  ctx.fillRect(barX, barY, barW * Math.max(0, b.health) / b.maxHealth, 14);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, 14);
  drawLabel(`The Magical Elephant ${Math.max(0, Math.round(b.health))}/${b.maxHealth}`, canvas.width / 2, barY - 6, 'center');
}

function gameLoop() {
  if (!gameActive) return;

  drawBackground();
  currentWeapon = WEAPONS[document.getElementById('weaponSelect').value] || WEAPONS.fists;

  // Player movement
  if (!watchMode) {
    // Keyboard and joystick both feed into the same movement
    let moveX = stick.dx;
    if (keys['a'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['d'] || keys['ArrowRight']) moveX += 1;
    moveX = Math.max(-1, Math.min(1, moveX));
    if (moveX !== 0) player.vx = moveX * 4;

    const wantsJump = keys['w'] || keys['ArrowUp'] || stick.dy < -0.6;
    if (wantsJump && player.onGround) player.vy = -10;

    player.update(canvas.width, canvas.height);
  }

  // Enemies
  enemies.forEach((enemy, i) => {
    if (enemy.cooldown > 0) enemy.cooldown--;

    if (Math.random() > 0.88) enemy.vx += (Math.random() - 0.5) * 6;
    if (Math.random() > 0.93 && enemy.onGround) enemy.vy = -9;

    if (enemy.type === 'retro') {
      // Retro Stickguy swings his knife at the nearest target in reach
      if (enemy.cooldown === 0) {
        const targets = [];
        if (!watchMode && player) targets.push(player);
        enemies.forEach((other, j) => { if (j !== i) targets.push(other); });

        let best = null;
        let bestDist = Infinity;
        targets.forEach(t => {
          const d = Math.hypot(t.x - enemy.x, t.y - enemy.y);
          if (d < bestDist) { bestDist = d; best = t; }
        });

        if (best && bestDist < 55) {
          attack(enemy, best, 39, 8);
          enemy.cooldown = 90;
        }
      }
    } else {
      // Normal bots
      if (!watchMode) {
        const d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (d < 50 && Math.random() > 0.6) {
          player.vx += enemy.x > player.x ? -8 : 8;
          player.health -= 5 + Math.random() * 5;
        }
      }

      enemies.forEach((other, j) => {
        if (i !== j && other.type !== 'retro' && Math.random() > 0.85) {
          const d2 = Math.hypot(other.x - enemy.x, other.y - enemy.y);
          if (d2 < 50) attack(enemy, other, 3, 6);
        }
      });
    }

    enemy.update(canvas.width, canvas.height);
  });

  // Player auto-swing at the nearest enemy in reach
  if (!watchMode && enemies.length > 0 && Math.random() > 0.7) {
    let nearest = null;
    let nearestDist = Infinity;
    enemies.forEach(e => {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < nearestDist) { nearestDist = d; nearest = e; }
    });
    if (nearest && nearestDist < currentWeapon.reach) {
      attack(player, nearest, currentWeapon.damage, currentWeapon.knockback);
    }
  }

  if (bossMode && boss) {
    updateBoss();
    // Player swings at the elephant when in reach
    if (Math.random() > 0.7 && Math.hypot(boss.x - player.x, boss.y - player.y) < currentWeapon.reach + 40) {
      boss.health -= currentWeapon.damage;
    }
  }

  enemies.filter(e => e.health <= 0).forEach(e => addKill(e.lastHitBy, e));
  enemies = enemies.filter(e => e.health > 0);

  // Draw
  if (!watchMode) player.draw();
  enemies.forEach(e => e.draw());
  if (bossMode && boss) drawBoss();

  // Text
  drawKillFeed();
  if (!watchMode) {
    drawLabel(`Health: ${Math.max(0, Math.round(player.health))}`, 10, 25);
    drawLabel(`Enemies: ${enemies.length}`, 10, 45);
    document.getElementById('healthDisplay').textContent = Math.max(0, Math.round(player.health)) + '%';
  } else {
    drawLabel(`Bots Left: ${enemies.length}`, 10, 25);
    document.getElementById('healthDisplay').textContent = 'Watching...';
  }
  document.getElementById('enemiesDisplay').textContent = enemies.length;

  // End conditions
  if (!watchMode && player.health <= 0) {
    gameActive = false;
    document.getElementById('gameOverMsg').style.display = 'block';
    document.getElementById('gameOverMsg').textContent = 'YOU DIED 💀';
    record.losses++;
  } else if (watchMode && enemies.length === 1) {
    gameActive = false;
    document.getElementById('gameOverMsg').style.display = 'block';
    document.getElementById('gameOverMsg').textContent = `${enemies[0].type === 'retro' ? 'Retro Stickguy' : 'Bot'} Wins! 🎉`;
  } else if (watchMode && enemies.length === 0) {
    gameActive = false;
    document.getElementById('gameOverMsg').style.display = 'block';
    document.getElementById('gameOverMsg').textContent = 'Nobody Wins! 💀';
  } else if (bossMode && boss && boss.health <= 0) {
    gameActive = false;
    document.getElementById('gameOverMsg').style.display = 'block';
    document.getElementById('gameOverMsg').textContent = 'THE ELEPHANT FALLS! 🐘🎉';
    record.wins++;
    coins += 200;
    updateRecord();
    updateShop();
  } else if (!watchMode && !bossMode && enemies.length === 0) {
    gameActive = false;
    document.getElementById('gameOverMsg').style.display = 'block';
    document.getElementById('gameOverMsg').textContent = 'YOU WIN! 🎉';
    record.wins++;
    coins += 100;
    updateShop();
  } else {
    requestAnimationFrame(gameLoop);
  }
}

function backToMenu() {
  gameActive = false;
  resetStick();
  updateRecord();
  document.getElementById('gameplay').classList.remove('active');
  document.getElementById('menu').classList.remove('hidden');
}
</script>
